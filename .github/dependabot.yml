version: 2

updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      hex:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
