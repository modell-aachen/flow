name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Toolchain and env come from devbox.json/devbox.lock, so there is
      # nothing to keep in sync here.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: "true"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
            .nix-mix
            .nix-hex
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'devbox.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # Starts the docker-compose database and runs `mix ci`, exactly like
      # `devbox run ci` does locally.
      - run: devbox run ci
