name: No External PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}

    runs-on: ubuntu-24.04

    permissions:
      pull-requests: write

    steps:
      - run: |
          gh pr close "$PR" --comment "$COMMENT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT: |
            Thanks for this — we can't merge it. Flow is open source but not open
            contribution: all code is owned by one entity, and accepting patches
            would mean running a CLA process we currently don't have the capacity
            for. Not a judgement on the change itself.

            If you'd open an issue describing the problem, we'll pick it up from
            there. See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
